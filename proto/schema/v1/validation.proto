syntax = "proto3";

package schema.v1;

import "schema/v1/schema.proto";

message ValidationViolation {
  string field = 1;
  string message = 2;
}

message ValidateMessageRequest {
  OcppVersion ocpp_version = 1;
  string action = 2;
  MessageType message_type = 3;
  optional string vendor = 4;
  optional string model = 5;
  bytes message = 6;
}

message ValidateMessageResponse {
  bool valid = 1;
  repeated ValidationViolation violations = 2;
}

message BulkValidateMessagesRequest {
  OcppVersion ocpp_version = 1;
  optional string vendor = 2;
  optional string model = 3;
  // OCPP-J messages as JSON objects ({"messageTypeId", "uniqueId", "action",
  // "payload"}); action and message type are read from each message rather
  // than supplied once for the whole batch. Validated against the schema
  // they identify and returned in the same order as supplied here.
  repeated string messages = 4;
}

message ValidationReportEntry {
  // Position of the corresponding message in the request's messages list.
  int32 index = 1;
  bool valid = 2;
  repeated ValidationViolation violations = 3;
}

message BulkValidateMessagesResponse {
  repeated ValidationReportEntry results = 1;
}

service SchemaValidationService {
  rpc ValidateMessage(ValidateMessageRequest) returns (ValidateMessageResponse);
  rpc BulkValidateMessages(BulkValidateMessagesRequest) returns (BulkValidateMessagesResponse);
}