# GoReleaser configuration file
version: 2

project_name: chargeflow-registry
builds:
  - id: chargeflow-registry
    main: ./cmd/app
    binary: chargeflow-registry
    goos:
      - linux
    goarch:
      - amd64
      - arm64

archives:
  - id: chargeflow-registry-archive
    format: tar.gz
    files:
      - LICENSE.md
      - README.md

dockers_v2:
  - images:
      - "ghcr.io/chargepi/chargeflow-registry"
    tags:
      - "{{ .Tag }}"
      - "latest"
    dockerfile: Dockerfile.release
    platforms:
      - linux/amd64
      - linux/arm64

release:
  github:
    owner: "{{ .Env.GITHUB_REPOSITORY_OWNER }}"
    name: chargeflow-registry

changelog:
  sort: asc
  filters:
    exclude:
      - '.*\.md$'